name: Publish Gusu Trails to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the static website
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /SuzhouMap/
      - name: Verify the public package
        run: node --test tests/pages-build.test.mjs tests/map-stream.test.mjs tests/place-content.test.mjs
      - name: Check types
        run: npx tsc --noEmit
      - name: Install browser for regression tests
        run: npx playwright install --with-deps chromium
      - name: Test responsive interactions
        run: npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
